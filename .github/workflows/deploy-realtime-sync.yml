name: Deploy realtime-sync

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/realtime-sync/**"

jobs:
  deploy:
    name: Deploy Hocuspocus server to Fly.io
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: apps/realtime-sync
        run: |
          flyctl deploy --remote-only \
            --app "${{ github.ref_name == 'main' && secrets.FLY_APP_NAME_PROD || secrets.FLY_APP_NAME_STAGING }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
